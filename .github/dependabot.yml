version: 2

updates:

npm packages (React, Vite, Firebase, Supabase, etc.)

- package-ecosystem: "npm"
  directory: "/"
  schedule:
  interval: "daily"
  open-pull-requests-limit: 20
  commit-message:
  prefix: "deps"
  include: "scope"
  labels:
  - "dependencies"
  - "security"
  - "automated"

GitHub Actions

- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
  interval: "daily"
  open-pull-requests-limit: 20
  commit-message:
  prefix: "ci"
  include: "scope"
  labels:
  - "github-actions"
  - "security"
  - "automated"
